<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Echo’s Deep Dive · The Mirror Reef</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>

:root{
  --teal:#00A7B2; --teal2:#42bcb8; --teal3:#00928e; --tealSoft:#E3F6F7; --tealMist:#F3FBFB;
  --orange:#FAA71C; --burnt:#D77F28; --crimson:#C92426; --emerald:#047857; --leaf:#66A34E;
  --ink:#151515; --muted:#44585a; --bg:#FFFFFF;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:18px;line-height:1.45}
h1,h2,h3,.disp{font-family:"Fredoka","Nunito",system-ui,sans-serif;font-weight:600;letter-spacing:.2px}
button{font:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--orange);outline-offset:3px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  max-width:1180px;margin:0 auto;padding:16px 18px 8px}
.title h1{margin:0;font-size:clamp(26px,4vw,38px);color:var(--teal3);line-height:1.1}
.title p{margin:2px 0 0;color:var(--muted);font-size:16px}
.hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:8px;background:var(--tealMist);border:2px solid var(--tealSoft);
  border-radius:999px;padding:6px 14px;font-weight:800}
.pill.stars{background:#FFF6E3;border-color:#FDE2AE;color:#8a4b0f}
.pill .big{font-family:Fredoka,sans-serif;font-size:22px}
.iconbtn{border:2px solid var(--tealSoft);background:#fff;border-radius:999px;padding:6px 12px;font-weight:800;color:var(--teal3)}

.wrap{max-width:1180px;margin:0 auto;padding:6px 18px 28px;display:grid;
  grid-template-columns:minmax(300px,440px) 1fr;gap:22px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:1fr}}

.sceneBox{position:relative;border-radius:28px;overflow:hidden;border:3px solid var(--tealSoft);background:#fff}
#scene{display:block;width:100%;height:auto;max-height:78vh}
@media (max-width:860px){#scene{max-height:60vh}}
.gauge{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border-top:3px solid var(--tealSoft);
  padding:10px 12px;font-weight:800;color:var(--teal3)}
.gauge b{font-family:Fredoka,sans-serif;font-size:26px;color:var(--ink)}
.gauge.broken b{color:var(--crimson)}

.panel{background:#fff;border:3px solid var(--tealSoft);border-radius:28px;padding:20px 22px 22px;min-height:420px}
.steps{display:flex;gap:8px;margin:0 0 14px;padding:0;list-style:none;flex-wrap:wrap}
.steps li{flex:1;min-width:110px;border-radius:14px;padding:6px 10px;font-weight:800;font-size:14px;
  background:var(--tealMist);color:var(--muted);border:2px solid var(--tealSoft)}
.steps li.now{background:var(--teal);color:#fff;border-color:var(--teal)}
.steps li.done{background:#E8F4E3;color:var(--emerald);border-color:#cfe6c6}

.talk{display:flex;gap:14px;align-items:flex-start;margin:6px 0 16px}
.talk .face{flex:0 0 72px;width:72px;height:72px}
.bubble{position:relative;background:var(--tealMist);border:2px solid var(--tealSoft);border-radius:20px;padding:12px 16px;font-size:19px}
.bubble .who{display:block;font-family:Fredoka,sans-serif;font-weight:700;color:var(--teal3);font-size:16px}
.talk.inky .bubble{background:#FDEEEE;border-color:#F5C9C9}
.talk.inky .bubble .who{color:var(--crimson)}
.talk.echo .bubble{background:#FFF6E3;border-color:#FDE2AE}
.talk.echo .bubble .who{color:var(--burnt)}

.q{font-size:22px;font-weight:800;margin:6px 0 16px;line-height:1.35}
.q .tag{display:inline-block;background:var(--orange);color:#3b2200;border-radius:10px;padding:0 8px;margin-right:6px;font-size:16px}
.choices{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.choice{border:3px solid var(--tealSoft);background:#fff;border-radius:20px;padding:14px 12px;font-weight:800;font-size:19px;
  color:var(--ink);transition:transform .12s ease, background .2s ease}
.choice:hover{transform:translateY(-2px);background:var(--tealMist)}
.choice.plus{border-color:#9FDDE0}
.choice.minus{border-color:#F3B9B9}
.choice.zero{border-color:#FDE2AE}
.choice .sym{display:block;font-family:Fredoka,sans-serif;font-size:40px;line-height:1}
.choice.plus .sym{color:var(--teal3)} .choice.minus .sym{color:var(--crimson)} .choice.zero .sym{color:var(--burnt)}
.choice.right{background:#E8F4E3;border-color:var(--leaf)}
.choice.wrong{background:#FDEEEE;border-color:var(--crimson);animation:shake .35s}
.choice[disabled]{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.feedback{margin-top:16px;border-radius:18px;padding:12px 16px;font-size:18px;display:none}
.feedback.good{display:block;background:#E8F4E3;border:2px solid #cfe6c6;color:#1f4d12}
.feedback.oops{display:block;background:#FFF6E3;border:2px solid #FDE2AE;color:#6b3a06}
.go{margin-top:18px;border:0;border-radius:999px;background:var(--teal);color:#fff;font-weight:800;font-size:20px;
  padding:12px 26px;box-shadow:0 6px 0 var(--teal3);font-family:Fredoka,sans-serif}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 var(--teal3)}
.go.orange{background:var(--orange);color:#3b2200;box-shadow:0 6px 0 var(--burnt)}
.hint{color:var(--muted);font-size:16px;margin-top:8px}
.counter{font-weight:800;color:var(--muted);font-size:15px}

.end{text-align:center}
.end .talk{text-align:left}
.end h2{font-size:34px;color:var(--teal3);margin:6px 0}
.badge{display:inline-flex;flex-direction:column;align-items:center;gap:4px;margin:10px auto;padding:14px 22px;border-radius:24px;
  background:#FFF6E3;border:3px solid var(--orange)}
.badge .disp{font-size:24px;color:var(--burnt)}
.rating{font-size:34px;letter-spacing:4px}

/* scene animation */
.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-4px)}}
.prop{animation:spin .4s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{50%{transform:scaleY(.2)}}
.wave{animation:wave 6s linear infinite}
@keyframes wave{to{transform:translateX(-80px)}}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.bubbleDot{animation:rise 1.6s ease-out forwards}
@keyframes rise{to{transform:translateY(-90px);opacity:0}}
#echo,#creatures,#fx{pointer-events:none}
.band{fill:transparent;cursor:default}
.armed .band{cursor:pointer}
.armed .band:hover,.armed .band:focus{fill:rgba(250,167,28,.22)}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:58px;padding:10px;border:3px dashed var(--tealSoft);border-radius:18px;margin:6px 0 10px}
.bins{display:grid;gap:10px}
.bin{border:3px solid var(--tealSoft);border-radius:18px;padding:8px;min-height:120px;background:var(--tealMist)}
.bin>b{display:block;text-align:center;font-family:Fredoka,sans-serif;font-size:24px;margin-bottom:6px}
.bin>b.plus{color:var(--teal3)} .bin>b.minus{color:var(--crimson)} .bin>b.zero{color:var(--burnt)}
.bin .drop{display:flex;flex-direction:column;gap:6px}
.pool.ready,.bin.ready{border-color:var(--orange)} .pool.over,.bin.over{background:#FFF6E3}
.dc{border:2px solid var(--teal2);background:#fff;border-radius:14px;padding:8px 10px;font-weight:800;font-size:16px;text-align:left;cursor:grab}
.dc.picked{outline:3px solid var(--orange);background:#FFF6E3} .dc.bad{border-color:var(--crimson);background:#FDEEEE} .dc.good{border-color:var(--leaf);background:#E8F4E3}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 4px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mi{position:relative;border:3px solid var(--tealSoft);background:#fff;border-radius:16px;padding:10px 38px 10px 12px;font-weight:800;font-size:16px;text-align:left;min-height:50px}
.mi.L{background:var(--tealMist)} .mi.sel{border-color:var(--orange)!important;box-shadow:0 0 0 3px #FDE2AE}
.mi .tagn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;color:#fff;font-size:13px;display:grid;place-items:center}
.mi .tagn:empty{display:none}
.tick{display:flex;align-items:center;gap:10px;text-align:left}
.tick .box{flex:0 0 24px;width:24px;height:24px;border-radius:8px;border:3px solid var(--teal2);background:#fff}
.tick[aria-pressed="true"]{background:var(--tealMist);border-color:var(--teal)}
.tick[aria-pressed="true"] .box{background:var(--teal);box-shadow:inset 0 0 0 3px #fff}
.typeRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.typeRow input{width:150px;border:3px solid var(--tealSoft);border-radius:16px;padding:10px 14px;font:700 24px Fredoka,Nunito,sans-serif;text-align:center}
.pm{border:3px solid var(--tealSoft);background:var(--tealMist);border-radius:16px;padding:10px 16px;font-weight:800;font-size:20px}
.tick{font-size:17px}
#w .choices{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.qtype{display:inline-block;font-size:14px;font-weight:800;border-radius:999px;padding:2px 10px;background:#FFF6E3;color:#8a4b0f;border:2px solid #FDE2AE;margin-bottom:4px}
@media (max-width:560px){.bins{grid-template-columns:1fr!important}.match{gap:8px}}
.confetti{position:fixed;top:-20px;width:12px;height:18px;border-radius:3px;z-index:20;animation:fall 2.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){
  .bob,.prop,.wave,.blink{animation:none}
  .pop,.bubbleDot,.confetti,.choice.wrong{animation-duration:.01s}
}
</style>
<style>
.sceneBox svg{display:block;width:100%;height:auto;max-height:78vh}
@media (max-width:860px){.sceneBox svg{max-height:60vh}}
.armed .band,.armed .pt{cursor:pointer}
.armed .band:hover,.armed .band:focus{fill:rgba(250,167,28,.22)}
.pt{fill:transparent}
.armed .pt:hover,.armed .pt:focus{fill:rgba(250,167,28,.45)}
.mathq{font-family:Fredoka,Nunito,sans-serif;font-size:30px;font-weight:600;letter-spacing:.5px}
</style>
</head>
<body>
<header class="top">
  <div class="title"><h1 id="gTitle"></h1><p id="gSub"></p></div>
  <div class="hud">
    <div class="pill stars" aria-live="polite"><span>⭐</span><span class="big" id="starCount">0</span><span>stars</span></div>
    <button class="iconbtn" id="soundBtn" aria-pressed="true">🔊 Sound on</button>
  </div>
</header>
<main class="wrap">
  <section class="sceneBox" aria-label="Story scene">
    <svg id="scene" viewBox="0 0 420 580" role="img"></svg>
    <div class="gauge broken" id="gauge" aria-live="polite"><span id="gaugeLabel">Gauge:</span> <b id="gaugeVal">??</b></div>
  </section>
  <section class="panel" aria-live="polite">
    <ol class="steps" id="steps"></ol>
    <div id="stage"></div>
  </section>
</main>
<script>
(function(){
"use strict";
const MINUS="\u2212";
const fmt=n=>{ if(Array.isArray(n)) return `(${fmt0(n[0])}, ${fmt0(n[1])})`; return n>0?"+"+n:(n<0?MINUS+Math.abs(n):"0"); };
const fmt0=n=>n<0?MINUS+Math.abs(n):String(n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=(a,n)=>shuffle(a).slice(0,n);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const one=a=>a[Math.floor(Math.random()*a.length)];
const reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const $=id=>document.getElementById(id);
const NS="http://www.w3.org/2000/svg";
const stage=$("stage"), scene=$("scene");
let stars=0, maxStars=0, soundOn=true, SC=null, echoPos=0, gaugeOn=true, placed=0;

/* ---------- sound ---------- */
let ac=null;
function tone(freqs,dur){ if(!soundOn)return; try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  freqs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=f;
   const t=ac.currentTime+i*dur;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);
   g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.02);});
 }catch(e){} }
const yay=()=>tone([523,659,784],.12), oops=()=>tone([300,220],.16);
$("soundBtn").addEventListener("click",e=>{soundOn=!soundOn;e.currentTarget.setAttribute("aria-pressed",soundOn);
  e.currentTarget.textContent=soundOn?"🔊 Sound on":"🔇 Sound off";});

/* ---------- characters & art ---------- */
const ECHO_SVG=`<g class="bob"><rect x="-12" y="-46" width="30" height="22" rx="8" fill="#00928e"/><rect x="6" y="-62" width="6" height="18" rx="3" fill="#00928e"/><rect x="6" y="-64" width="18" height="6" rx="3" fill="#00928e"/><ellipse cx="0" cy="-8" rx="58" ry="30" fill="#00A7B2"/><ellipse cx="-6" cy="-20" rx="40" ry="10" fill="#42bcb8" opacity=".7"/><circle cx="16" cy="-8" r="15" fill="#fff" stroke="#FAA71C" stroke-width="5"/><circle cx="19" cy="-8" r="6" fill="#151515"/><circle cx="21" cy="-10" r="2" fill="#fff"/><circle cx="-22" cy="-6" r="6" fill="#fff" opacity=".9"/><circle cx="-40" cy="-6" r="5" fill="#fff" opacity=".9"/><path d="M4 10 q12 8 24 0" stroke="#151515" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="-66" y="-14" width="10" height="14" rx="3" fill="#D77F28"/><g class="prop"><ellipse cx="-72" cy="-7" rx="4" ry="16" fill="#FAA71C"/></g></g>`;
const CREATURE={
 gull:`<path d="M-22 0 q11 -14 22 0 q11 -14 22 0" stroke="#151515" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="0" cy="1" r="3" fill="#FAA71C"/>`,
 drone:`<rect x="-14" y="-5" width="28" height="10" rx="4" fill="#D77F28"/><line x1="-20" y1="-9" x2="-6" y2="-9" stroke="#151515" stroke-width="3"/><line x1="6" y1="-9" x2="20" y2="-9" stroke="#151515" stroke-width="3"/>`,
 buoy:`<rect x="-10" y="-22" width="20" height="26" rx="6" fill="#C92426"/><rect x="-10" y="-13" width="20" height="7" fill="#fff"/><line x1="0" y1="-22" x2="0" y2="-34" stroke="#151515" stroke-width="3"/><circle cx="0" cy="-36" r="4" fill="#FAA71C"/>`,
 fish:`<ellipse cx="0" cy="0" rx="18" ry="10" fill="#FAA71C"/><path d="M16 0 l12 -9 v18z" fill="#D77F28"/><circle cx="-8" cy="-2" r="3" fill="#151515"/>`,
 puffer:`<circle r="14" fill="#FAA71C"/><g stroke="#D77F28" stroke-width="3">${[0,45,90,135,180,225,270,315].map(a=>`<line x1="0" y1="-14" x2="0" y2="-20" transform="rotate(${a})"/>`).join("")}</g><circle cx="-5" cy="-3" r="3" fill="#151515"/>`,
 turtle:`<ellipse rx="18" ry="11" fill="#66A34E"/><path d="M-10 -4 h20 M-12 4 h24" stroke="#047857" stroke-width="2"/><circle cx="-22" cy="0" r="6" fill="#66A34E"/><circle cx="-24" cy="-1" r="1.6" fill="#151515"/>`,
 jelly:`<path d="M-14 0 a14 14 0 0 1 28 0z" fill="#F29A9B"/><g stroke="#C92426" stroke-width="2.5" fill="none"><path d="M-8 0 q-3 8 0 16"/><path d="M0 0 q3 8 0 18"/><path d="M8 0 q-3 8 0 16"/></g>`,
 crab:`<ellipse rx="16" ry="10" fill="#C92426"/><circle cx="-6" cy="-12" r="3" fill="#151515"/><circle cx="6" cy="-12" r="3" fill="#151515"/><path d="M-16 -2 l-10 -8 M16 -2 l10 -8" stroke="#C92426" stroke-width="4" stroke-linecap="round"/>`,
 chest:`<rect x="-16" y="-8" width="32" height="18" rx="3" fill="#D77F28"/><rect x="-16" y="-16" width="32" height="9" rx="4" fill="#FAA71C"/><rect x="-3" y="-6" width="6" height="7" fill="#151515"/>`,
 star:`<path d="M0 -14 L4 -4 L14 -3 L6 4 L9 14 L0 8 L-9 14 L-6 4 L-14 -3 L-4 -4Z" fill="#FAA71C" stroke="#D77F28" stroke-width="2"/>`,
 flag:`<line x1="0" y1="-16" x2="0" y2="16" stroke="#151515" stroke-width="3"/><path d="M1 -15 h18 l-5 7 l5 7 h-18z" fill="#00A7B2"/>`,
 vent:`<path d="M-14 12 L-6 -6 L6 -6 L14 12Z" fill="#D77F28"/><circle cx="0" cy="-14" r="6" fill="#ddd" opacity=".8"/><circle cx="4" cy="-24" r="5" fill="#ddd" opacity=".6"/>`
};
const FACE={
 mira:`<svg class="face" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="34" fill="#E3F6F7"/><circle cx="36" cy="40" r="18" fill="#8d5a3b"/><path d="M16 34 a20 20 0 0 1 40 0 h-40z" fill="#FAA71C"/><rect x="14" y="32" width="44" height="6" rx="3" fill="#D77F28"/><circle cx="36" cy="26" r="4" fill="#fff"/><circle cx="29" cy="42" r="2.6" fill="#151515"/><circle cx="43" cy="42" r="2.6" fill="#151515"/><path d="M30 49 q6 5 12 0" stroke="#151515" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M18 40 q-4 10 2 16 M54 40 q4 10 -2 16" stroke="#2a1a10" stroke-width="5" fill="none" stroke-linecap="round"/></svg>`,
 echo:`<svg class="face" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="34" fill="#FFF6E3"/><ellipse cx="36" cy="40" rx="28" ry="17" fill="#00A7B2"/><rect x="30" y="16" width="14" height="12" rx="4" fill="#00928e"/><circle cx="42" cy="40" r="9" fill="#fff" stroke="#FAA71C" stroke-width="3"/><circle cx="44" cy="40" r="4" fill="#151515"/><circle cx="22" cy="40" r="3.5" fill="#fff"/></svg>`,
 inky:`<svg class="face" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="34" fill="#FDEEEE"/><ellipse cx="36" cy="30" rx="18" ry="16" fill="#C92426"/><g stroke="#C92426" stroke-width="5" fill="none" stroke-linecap="round"><path d="M22 42 q-6 10 -2 16"/><path d="M30 44 q-2 10 2 16"/><path d="M42 44 q2 10 -2 16"/><path d="M50 42 q6 10 2 16"/></g><circle cx="30" cy="30" r="4" fill="#fff"/><circle cx="42" cy="30" r="4" fill="#fff"/><circle cx="31" cy="31" r="2" fill="#151515"/><circle cx="43" cy="29" r="2" fill="#151515"/><path d="M31 39 q5 -3 10 0" stroke="#fff" stroke-width="2" fill="none"/></svg>`
};
const NAME={mira:"Captain Mira",echo:"Echo",inky:"Inky the octopus"};
const talk=(who,text)=>`<div class="talk ${who}">${FACE[who]}<p class="bubble"><span class="who">${NAME[who]}</span>${text}</p></div>`;

/* ---------- scenes ---------- */
// vline: {kind:"vline", lo, hi, step (tap step), label (every), unit}
// hline: {kind:"hline", lo, hi, step, label, unit, west, east}
// plane: {kind:"plane", r}
function txt(x,y,t,o={}){return `<text x="${x}" y="${y}" font-family="Fredoka,Nunito,sans-serif" font-size="${o.size||15}" font-weight="${o.w||600}" fill="${o.fill||"#151515"}" text-anchor="${o.anchor||"middle"}">${t}</text>`;}
const labelOf=v=>{ if(typeof v==="number"&&!Number.isInteger(v)){ const r=Math.round(v*100)/100; return (r>0?"+":r<0?MINUS:"")+Math.abs(r); } return fmt(v); };
function buildScene(cfg){
  SC=Object.assign({unit:"m"},cfg); placed=0; scene.classList.remove("armed");
  let s=`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DDF4F5"/></linearGradient><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9FE3E5"/><stop offset=".55" stop-color="#5CC9CB"/><stop offset="1" stop-color="#21A9AD"/></linearGradient><linearGradient id="seaH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BDEDEF"/><stop offset="1" stop-color="#7FD6D9"/></linearGradient></defs>`;
  if(SC.kind==="vline"){
    scene.setAttribute("viewBox","0 0 420 580");
    const {lo,hi}=SC; SC.Y=v=>40+(hi-v)/(hi-lo)*500; const zy=SC.Y(Math.min(Math.max(0,lo),hi));
    s+=`<rect width="420" height="${zy}" fill="url(#sky)"/><circle cx="360" cy="62" r="30" fill="#FAA71C" opacity=".9"/><rect y="${zy}" width="420" height="${580-zy}" fill="url(#sea)"/>`;

    const qhtml=r.who?talk(r.who,r.q):`<p class="q">${r.q}</p>`;
    stage.innerHTML=counter+qhtml+`<span class="qtype">${QTYPE[r.type]}</span><div id="w"></div><div id="after"></div>`;
    const finish=first=>{ if(first) addStar(STARS[r.type]); fbSet($("w"),"good",(first?"⭐".repeat(STARS[r.type])+" ":"")+(first?"Brilliant! ":"Got it! ")+(r.why||""));
      const cont=()=>{ $("after").innerHTML=`<button class="go" id="nx">Next</button>`; $("nx").onclick=next; $("nx").focus(); };
      if(r.after) r.after({mark,moveEcho,placeCreature,clearMarks},cont); else cont(); };
    const w=$("w");
    if(r.type==="mc") makeMC(w,shuffle([r.answer].concat(r.wrong)),r.answer,finish);
    else if(r.type==="multi") makeMulti(w,shuffle(r.answers.concat(r.wrong)),r.answers,finish);
    else if(r.type==="match") makeMatch(w,r.pairs,finish);
    else if(r.type==="drag") makeDrag(w,r.bins,shuffle(r.items),finish);
    else if(r.type==="type") makeType(w,r.answer,finish,r.unit);
    else if(r.type==="tap"){
      w.innerHTML=`<p class="hint">${r.hint||"Tap the right spot in the scene."}</p><div class="feedback"></div>`;
      let tries=0;
      const onPick=v=>{ tries++; moveEcho(v,()=>{
        if(same(v,r.target)){ yay(); if(r.creature) placeCreature(r.creature,r.target); finish(tries===1); }
        else { oops(); fbSet(w,"oops",(r.miss?r.miss(v):`Echo is at ${fmt(v)}. That is not it.`)+" Try again!"); arm(true,onPick); } }); };
      arm(true,onPick);
    }
  }
}
function finale(){
  setStep(G.missions.length);
  const pct=stars/Math.max(1,maxStars), rate=pct>=.9?3:pct>=.7?2:1;
  stage.innerHTML=`<div class="end">
    <svg width="150" height="120" viewBox="0 0 150 120" aria-hidden="true"><rect x="25" y="55" width="100" height="55" rx="8" fill="#D77F28"/><rect x="68" y="62" width="14" height="18" rx="3" fill="#151515"/><g class="pop"><circle cx="55" cy="48" r="10" fill="#FAA71C"/><circle cx="75" cy="40" r="12" fill="#FAA71C"/><circle cx="96" cy="48" r="10" fill="#FAA71C"/></g><path d="M22 55 q53 -40 106 0z" fill="#FAA71C" transform="rotate(-18 22 55)"/></svg>
    <h2>${G.endTitle}</h2>
    <div class="rating" aria-label="${rate} out of 3">${"⭐".repeat(rate)}${"☆".repeat(3-rate)}</div>
    <p>You earned <b>${stars}</b> of <b>${maxStars}</b> stars.</p>
    <div class="badge"><span class="disp">🏅 ${G.badge}</span><span>${G.badgeText}</span></div>
    ${talk("echo",G.endLine)}
    <button class="go orange" id="again">Play again with new questions</button></div>`;
  $("again").onclick=()=>location.reload(); confetti(); yay();
}
function confetti(){ if(reduce)return; const cols=["#00A7B2","#FAA71C","#D77F28","#C92426","#66A34E","#42bcb8"];
  for(let i=0;i<70;i++){const c=document.createElement("div");c.className="confetti";c.style.left=Math.random()*100+"vw";
   c.style.background=cols[i%cols.length];c.style.animationDelay=Math.random()*1.2+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),4500);} }

/* ================= SESSION CONFIG ================= */
const VL={kind:"vline",lo:-10,hi:10,step:1,label:2,unit:"m",gauge:"Echo’s gauge"};
const HL={kind:"hline",lo:-8,hi:8,step:1,label:2,unit:"m",west:"west",east:"east",gauge:"Reef position",zeroLabel:false};
const opp=n=>n===0?0:-n;
G={
 title:"Echo’s Deep Dive: The Mirror Reef",
 sub:"Mission: find every mirror twin",
 scene:VL,
 intro:[
  ["mira","Welcome back, explorer! Today we sail to the <b>Mirror Reef</b>. The water here is like a mirror."],
  ["echo","Beep! Everything above sea level has a <b>mirror twin</b> below it, the same distance from 0!"],
  ["mira","Twins like +4 and "+MINUS+"4 are called <b>opposites</b>. Same distance from 0, opposite sides."],
  ["inky","Hee hee! I’ve hidden some twins and mixed up the mirror. Bet you can’t find them!"]
 ],
 missions:[
  {name:"Mirror twins",short:"Mirror twins",scene:VL,intro:"Each friend has a mirror twin on the other side of sea level. Tap where the twin is.",
   rounds:()=>{ const vals=shuffle([R(2,9),-R(2,9),R(1,9)]).concat([0]);
     const rs=vals.map(v=>({type:"tap",target:opp(v),creature:opp(v)>0?"gull":opp(v)<0?"fish":"buoy",
       setup:t=>{t.clearMarks(); t.mark(v,v===0?"buoy":"friend","#FAA71C");},
       q:v===0?"A buoy floats exactly at <b>0</b>. Where is its mirror twin?":`A friend is at <b>${fmt(v)} m</b>. Tap where its mirror twin is.`,
       why:v===0?"0 is its own opposite. Its twin is right there at 0!":`The opposite of ${fmt(v)} is ${fmt(opp(v))}. Both are ${Math.abs(v)} m from 0.`,
       miss:p=>`That is ${fmt(p)} m. The twin must be ${Math.abs(v)} m from 0 on the ${v>0?"other side, below":"other side, above"} sea level.`}));
     const n=R(2,12);
     rs.push({type:"mc",q:`What is the opposite of <b>${MINUS}${n}</b>?`,answer:"+"+n,wrong:[MINUS+n,"0",MINUS+(n+1)],why:`${MINUS}${n} and +${n} are both ${n} away from 0.`});
     rs.push({type:"drag",q:"Sort each number by where its <b>opposite</b> lives.",bins:[{key:"a",label:"Opposite is above 0",cls:"plus"},{key:"z",label:"Opposite is 0",cls:"zero"},{key:"b",label:"Opposite is below 0",cls:"minus"}],
       items:[{label:MINUS+R(2,9),bin:"a"},{label:MINUS+"2.5",bin:"a"},{label:"0",bin:"z"},{label:"+"+R(2,9),bin:"b"},{label:"+"+R(10,20),bin:"b"},{label:MINUS+R(10,20),bin:"a"}],
       why:"Negative numbers have positive opposites. Positive numbers have negative opposites. 0 stays 0."});
     return rs; },
   outro:["echo","Every twin found! Same distance from 0, opposite sides."]},
  {name:"Flip twice",short:"Flip twice",gauge:false,intro:"The minus sign means <b>“the opposite of”</b>. "+MINUS+"(5) means the opposite of 5. What happens if we flip twice?",
   rounds:()=>{ const a=R(2,9), b=R(2,9), c=R(2,9);
     return [
      {type:"say",who:"mira",text:`Look: <span class="mathq">${MINUS}(${MINUS}${a})</span> means <b>the opposite of ${MINUS}${a}</b>. Flip ${MINUS}${a} over 0 and you land on +${a}. Flip twice and you are back on the same side!`},
      {type:"type",q:`<span class="mathq">${MINUS}(${MINUS}${b}) = ____</span>`,answer:b,why:`The opposite of ${MINUS}${b} is ${b}.`},
      {type:"type",q:`The opposite of the opposite of <b>${c}</b> is ____`,answer:c,why:`Flip ${c} to ${MINUS}${c}, then flip back to ${c}.`},
      {type:"mc",q:`Which one is the same as <span class="mathq">${MINUS}(${MINUS}${a})</span>?`,answer:String(a),wrong:[MINUS+a,"0",MINUS+MINUS+a],why:`${MINUS}(${MINUS}${a}) = ${a}.`},
      {type:"match",q:"Match each mirror code to its number.",pairs:shuffle([[`${MINUS}(${MINUS}${a})`,`${a}`],[`${MINUS}(${a})`,`${MINUS}${a}`],[`${MINUS}(0)`,"0"],[`${MINUS}(${MINUS}(${MINUS}${b}))`,`${MINUS}${b}`]]),why:"Count the flips: an even number of flips lands back on the start side."},
      {type:"multi",q:`Tick ALL the codes that equal <b>+${c}</b>.`,answers:[`${MINUS}(${MINUS}${c})`,`${c}`,`the opposite of ${MINUS}${c}`],wrong:[`${MINUS}(${c})`,`${MINUS}${c}`,`the opposite of ${c}`],why:`They all land on +${c}.`}
     ]; },
   outro:["inky","Grr! You flipped my tricks right back at me!"]},
  {name:"Reef walk",short:"Reef walk",scene:HL,intro:"Now the reef runs <b>sideways</b>. East of 0 is positive, west of 0 is negative. Opposites are mirror twins across 0.",
   rounds:()=>{ const a=R(2,7), b=R(2,7);
     return [
      {type:"tap",q:`A starfish is at <b>${MINUS}${a}</b> (${a} m west). Tap its mirror twin.`,target:a,creature:"star",setup:t=>{t.clearMarks();t.mark(-a,"starfish");},why:`+${a} is ${a} m east of 0.`,miss:p=>`That is ${fmt(p)}. Count ${a} steps east of 0.`},
      {type:"tap",q:`Echo’s friend is at <b>+${b}</b>. Swim to <b>${MINUS}(+${b})</b>.`,target:-b,creature:"crab",setup:t=>{t.clearMarks();t.mark(b,"friend");},why:`${MINUS}(+${b}) is the opposite of +${b}, which is ${MINUS}${b}.`,miss:p=>`That is ${fmt(p)}. The opposite of +${b} is ${b} steps west.`},
      {type:"tap",q:`Swim to <b>${MINUS}(${MINUS}${a})</b>.`,target:a,creature:"star",setup:t=>t.clearMarks(),why:`${MINUS}(${MINUS}${a}) = +${a}.`,miss:p=>`That is ${fmt(p)}. Flip ${MINUS}${a} once to find its opposite.`},
      {type:"mc",q:"Which number is its own opposite?",answer:"0",wrong:["1",MINUS+"1","10"],why:"0 is the only number that is its own opposite."}
     ]; },
   outro:["mira","Great swimming! Opposites work on sideways lines too."]},
  {name:"Inky’s mirror mix-ups",short:"Inky’s mix-ups",who:"inky",gauge:false,intro:"Inky wrote some mirror facts. Some are true, some are tricks!",
   rounds:()=>{ const a=R(3,9),b=R(3,9);
     return [
      {type:"multi",who:"inky",q:"Tick ALL the facts that are TRUE.",answers:[`The opposite of ${MINUS}${a} is ${a}.`,`${MINUS}(${MINUS}${b}) = ${b}`,"0 is its own opposite."],wrong:[`The opposite of ${MINUS}${a} is ${MINUS}${a}.`,`${MINUS}(${MINUS}${b}) = ${MINUS}${b}`,"Opposites are on the same side of 0."],why:"Opposites are the same distance from 0 on opposite sides."},
      {type:"mc",who:"inky",q:`I say the opposite of “${a} m above sea level” is “${a} m above sea level”. Am I right?`,answer:`No. It is ${a} m below sea level.`,wrong:["Yes, that is right.",`No. It is ${a*2} m below sea level.`],why:"The opposite keeps the same distance but changes the direction."},
      {type:"type",who:"inky",q:`Fix my sum: <span class="mathq">${MINUS}(${MINUS}(${MINUS}${b})) = ____</span>`,answer:-b,why:`Three flips end on the negative side: ${MINUS}${b}.`}
     ]; },
   outro:["echo","Mirror Reef solved! Inky’s tricks are all fixed."]}
 ],
 endTitle:"Mirror Reef complete!",
 badge:"Mirror Master",
 badgeText:"You can find opposites and flip signs like a pro.",
 endLine:"Remember: opposites are the same distance from 0 on opposite sides. Flip twice and you are back home. 0 is its own opposite!"
};

$("steps").innerHTML=G.missions.map((m,i)=>`<li>${i+1} · ${m.short||m.name}</li>`).join("");
buildScene(G.scene); runIntro(0);
